<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --logo-shell-1: #f8fffd;
      --logo-shell-2: #ecfeff;
      --logo-panel: #07111f;
      --logo-letter-c: #f8fafc;
      --logo-letter-n: #ffffff;
      --logo-muted: rgba(15, 23, 42, 0.18);
      --logo-red: #ef3f3f;
      --logo-teal: #14b8a6;
      --logo-amber: #f59e0b;
      --logo-shadow: rgba(15, 23, 42, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --logo-shell-1: #020617;
        --logo-shell-2: #102421;
        --logo-panel: #f8fafc;
        --logo-letter-c: #06111f;
        --logo-letter-n: #07111f;
        --logo-muted: rgba(248, 250, 252, 0.22);
        --logo-red: #fb5050;
        --logo-teal: #2dd4bf;
        --logo-amber: #fbbf24;
        --logo-shadow: rgba(45, 212, 191, 0.26);
      }
    }
  </style>

  <rect x="28" y="28" width="456" height="456" rx="118" fill="url(#shell)"/>
  <rect x="44" y="44" width="424" height="424" rx="102" stroke="url(#outerStroke)" stroke-width="20"/>
  <rect x="92" y="92" width="328" height="328" rx="78" fill="var(--logo-panel)" filter="url(#cardShadow)"/>

  <path d="M128 161C160 122 205 102 256 102C308 102 352 122 384 161" stroke="var(--logo-muted)" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 27"/>
  <path d="M384 351C352 390 308 410 256 410C205 410 160 390 128 351" stroke="var(--logo-muted)" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 27"/>

  <g filter="url(#letterGlow)">
    <text x="142" y="316" fill="var(--logo-letter-c)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="174" font-weight="950" letter-spacing="-18">C</text>
    <text x="244" y="316" fill="var(--logo-letter-n)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="174" font-weight="950" letter-spacing="-12">N</text>
  </g>

  <path d="M205 336H307" stroke="url(#underline)" stroke-width="15" stroke-linecap="round"/>
  <path d="M132 257L96 222L132 187" stroke="var(--logo-teal)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M380 257L416 222L380 187" stroke="var(--logo-red)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="386" cy="119" r="15" fill="var(--logo-teal)"/>
  <circle cx="125" cy="391" r="12" fill="var(--logo-red)"/>
  <circle cx="256" cy="71" r="8" fill="var(--logo-amber)"/>

  <defs>
    <linearGradient id="shell" x1="64" y1="48" x2="452" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-shell-1)"/>
      <stop offset="1" stop-color="var(--logo-shell-2)"/>
    </linearGradient>

    <linearGradient id="outerStroke" x1="62" y1="54" x2="452" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-teal)"/>
      <stop offset="0.5" stop-color="var(--logo-amber)"/>
      <stop offset="1" stop-color="var(--logo-red)"/>
    </linearGradient>

    <linearGradient id="underline" x1="205" y1="336" x2="307" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-red)"/>
      <stop offset="1" stop-color="var(--logo-teal)"/>
    </linearGradient>

    <filter id="cardShadow" x="68" y="76" width="376" height="376" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="var(--logo-shadow)"/>
    </filter>

    <filter id="letterGlow" x="110" y="135" width="300" height="215" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(20, 184, 166, 0.24)"/>
    </filter>
  </defs>
</svg>
